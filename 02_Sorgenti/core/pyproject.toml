[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbit-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "keyring>=25,<27",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["orbit_core"]

[tool.hatch.build]
include = ["orbit_core/**/*.py", "orbit_core/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
